<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — SUPMEAL</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/index.html">SUPMEAL</a>
      <nav class="nav">
        <a href="/index.html">Accueil</a>
        <a href="/login.html">Connexion</a>
        <a href="/register.html">Inscription</a>
      </nav>
      <span id="api-status" class="status-badge status-badge--loading">API : vérification…</span>
    </div>
  </header>

  <main class="container">
    <section class="auth-card">
      <h1>Connexion</h1>

      <p id="form-error" class="form-error" hidden></p>

      <form id="login-form" class="auth-form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />

        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />

        <button type="submit" class="btn btn--primary">Se connecter</button>
      </form>

      <div class="auth-divider"><span>ou</span></div>

      <button id="google-login" type="button" class="btn btn--google">Continuer avec Google</button>

      <p class="auth-switch">Pas encore de compte ? <a href="/register.html">S'inscrire</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>SUPMEAL &mdash; Projet SUPINFO M1</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
