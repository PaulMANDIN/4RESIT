<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription — SUPMEAL</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/index.html">SUPMEAL</a>
      <nav class="nav">
        <a href="/index.html">Accueil</a>
        <a href="/login.html">Connexion</a>
        <a href="/register.html">Inscription</a>
      </nav>
      <span id="api-status" class="status-badge status-badge--loading">API : vérification…</span>
    </div>
  </header>

  <main class="container">
    <section class="auth-card">
      <h1>Créer un compte</h1>

      <p id="form-error" class="form-error" hidden></p>

      <form id="register-form" class="auth-form">
        <label for="name">Nom</label>
        <input type="text" id="name" name="name" required autocomplete="name" />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />

        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" />

        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" autocomplete="new-password" />

        <button type="submit" class="btn btn--primary">S'inscrire</button>
      </form>

      <div class="auth-divider"><span>ou</span></div>

      <div id="google-signin-button" class="google-signin-button"></div>

      <p class="auth-switch">Déjà un compte ? <a href="/login.html">Se connecter</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>SUPMEAL &mdash; Projet SUPINFO M1</p>
    </div>
  </footer>

  <script src="https://accounts.google.com/gsi/client" defer></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
