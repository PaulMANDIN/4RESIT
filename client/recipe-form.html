<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recette — SUPMEAL</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/index.html">SUPMEAL</a>
      <nav class="nav">
        <a href="/index.html">Accueil</a>
        <a href="/login.html">Connexion</a>
        <a href="/register.html">Inscription</a>
      </nav>
      <span id="api-status" class="status-badge status-badge--loading">API : vérification…</span>
    </div>
  </header>

  <main class="container">
    <h1 id="form-title">Nouvelle recette</h1>

    <p id="page-error" class="alert alert--error" hidden></p>

    <form id="recipe-form" class="form">
      <label for="title">Titre</label>
      <input type="text" id="title" required maxlength="150" />

      <label for="description">Description</label>
      <textarea id="description" maxlength="5000"></textarea>

      <div class="form-row">
        <div>
          <label for="prepTime">Préparation (min)</label>
          <input type="number" id="prepTime" min="0" />
        </div>
        <div>
          <label for="cookTime">Cuisson (min)</label>
          <input type="number" id="cookTime" min="0" />
        </div>
        <div>
          <label for="portions">Portions</label>
          <input type="number" id="portions" min="1" />
        </div>
      </div>

      <div class="form-row">
        <div>
          <label for="source">Source</label>
          <input type="text" id="source" maxlength="255" />
        </div>
        <div>
          <label for="imageUrl">URL de l'image</label>
          <input type="text" id="imageUrl" maxlength="255" />
        </div>
      </div>

      <label for="imageFile">Ou importer une image</label>
      <input type="file" id="imageFile" accept="image/jpeg,image/png,image/webp,image/gif" />
      <img id="image-preview" class="image-preview" hidden />

      <label for="cookbookId">Cookbook</label>
      <select id="cookbookId">
        <option value="">Recette personnelle (aucun cookbook)</option>
      </select>

      <label>Ingrédients</label>
      <div id="ingredient-list" class="dynamic-list"></div>
      <button type="button" id="add-ingredient-btn" class="add-row-btn">+ Ajouter un ingrédient</button>

      <label>Étapes</label>
      <div id="step-list" class="dynamic-list"></div>
      <button type="button" id="add-step-btn" class="add-row-btn">+ Ajouter une étape</button>

      <label for="tags">Tags (séparés par des virgules)</label>
      <input type="text" id="tags" placeholder="rapide, végétarien, dessert" />

      <div class="form-actions">
        <button type="submit" class="btn btn--primary">Enregistrer</button>
        <a href="/recipes.html" class="btn btn--secondary">Annuler</a>
      </div>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>SUPMEAL &mdash; Projet SUPINFO M1</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/recipe-form.js"></script>
</body>
</html>
