<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookbook — SUPMEAL</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/index.html">SUPMEAL</a>
      <nav class="nav">
        <a href="/index.html">Accueil</a>
        <a href="/login.html">Connexion</a>
        <a href="/register.html">Inscription</a>
      </nav>
      <span id="api-status" class="status-badge status-badge--loading">API : vérification…</span>
    </div>
  </header>

  <main class="container">
    <p id="page-error" class="alert alert--error" hidden></p>

    <div id="cookbook-detail"></div>

    <section class="section">
      <h2>Membres</h2>
      <ul id="member-list" class="member-list"></ul>
      <form id="add-member-form" class="inline-form">
        <label class="visually-hidden" for="member-email">Email du membre</label>
        <input type="email" id="member-email" placeholder="Email du membre" required />
        <label class="visually-hidden" for="member-role">Rôle du membre</label>
        <select id="member-role">
          <option value="READER">Lecteur</option>
          <option value="COMMENTER">Commentateur</option>
          <option value="EDITOR">Éditeur</option>
        </select>
        <button type="submit" class="btn btn--secondary">Ajouter</button>
      </form>
    </section>

    <section class="section">
      <div class="page-header">
        <h2>Recettes</h2>
        <a id="new-recipe-link" href="#" class="btn btn--primary btn--small">Nouvelle recette</a>
      </div>
      <form id="cookbook-search-form" class="filter-bar">
        <label class="visually-hidden" for="cookbook-search-q">Rechercher dans ce cookbook</label>
        <input type="search" id="cookbook-search-q" placeholder="Rechercher dans ce cookbook (titre, tags, ingrédients)…" />
        <div class="filter-bar__actions">
          <button type="submit" class="btn btn--primary btn--small">Rechercher</button>
          <button type="button" id="cookbook-search-reset" class="btn btn--secondary btn--small">Réinitialiser</button>
        </div>
      </form>
      <div id="cookbook-recipes" class="card-list"></div>
    </section>

    <section class="section">
      <h2>Messagerie</h2>
      <div id="chat-messages" class="chat-messages"></div>
      <form id="chat-form" class="inline-form">
        <label class="visually-hidden" for="chat-input">Écrire un message</label>
        <input type="text" id="chat-input" placeholder="Écrire un message…" maxlength="2000" required />
        <button type="submit" class="btn btn--primary">Envoyer</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>SUPMEAL &mdash; Projet SUPINFO M1</p>
    </div>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/cookbook.js"></script>
</body>
</html>
