<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recettes — SUPMEAL</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/index.html">SUPMEAL</a>
      <nav class="nav">
        <a href="/index.html">Accueil</a>
        <a href="/login.html">Connexion</a>
        <a href="/register.html">Inscription</a>
      </nav>
      <span id="api-status" class="status-badge status-badge--loading">API : vérification…</span>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1>Mes recettes</h1>
      <a href="/recipe-form.html" class="btn btn--primary">Nouvelle recette</a>
    </div>

    <p id="page-error" class="alert alert--error" hidden></p>

    <form id="filter-form" class="filter-bar">
      <input type="search" id="filter-q" placeholder="Rechercher…" />
      <fieldset class="filter-bar__checkboxes">
        <legend>Rechercher dans</legend>
        <label><input type="checkbox" id="filter-search-title" checked /> Titre</label>
        <label><input type="checkbox" id="filter-search-tags" checked /> Tags</label>
        <label><input type="checkbox" id="filter-search-ingredients" checked /> Ingrédients</label>
      </fieldset>
      <select id="filter-cookbook">
        <option value="">Tous les cookbooks</option>
      </select>
      <input type="text" id="filter-tags" placeholder="Tags (séparés par virgule)" />
      <input type="text" id="filter-ingredients" placeholder="Ingrédients (séparés par virgule)" />
      <label>Prépa max (min) <input type="number" id="filter-max-prep" min="0" /></label>
      <label>Cuisson max (min) <input type="number" id="filter-max-cook" min="0" /></label>
      <label><input type="checkbox" id="filter-favorite" /> Favoris uniquement</label>
      <div class="filter-bar__actions">
        <button type="submit" class="btn btn--primary btn--small">Filtrer</button>
        <button type="button" id="filter-reset" class="btn btn--secondary btn--small">Réinitialiser</button>
      </div>
    </form>

    <div id="recipe-list" class="card-list"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>SUPMEAL &mdash; Projet SUPINFO M1</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/recipes.js"></script>
</body>
</html>
