<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookbooks — SUPMEAL</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="/index.html">SUPMEAL</a>
      <nav class="nav">
        <a href="/index.html">Accueil</a>
        <a href="/login.html">Connexion</a>
        <a href="/register.html">Inscription</a>
      </nav>
      <span id="api-status" class="status-badge status-badge--loading">API : vérification…</span>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1>Mes cookbooks</h1>
    </div>

    <p id="page-error" class="alert alert--error" hidden></p>

    <form id="create-cookbook-form" class="inline-form">
      <input type="text" id="cookbook-name" placeholder="Nom du cookbook" required maxlength="100" />
      <input type="text" id="cookbook-description" placeholder="Description (optionnel)" maxlength="2000" />
      <button type="submit" class="btn btn--primary">Créer</button>
    </form>

    <div id="cookbook-list" class="card-list"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>SUPMEAL &mdash; Projet SUPINFO M1</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/cookbooks.js"></script>
</body>
</html>
