version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: supmeal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supmeal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supmeal_secret}
      POSTGRES_DB: ${POSTGRES_DB:-supmeal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-supmeal}']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: supmeal_server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-supmeal}:${POSTGRES_PASSWORD:-supmeal_secret}@db:5432/${POSTGRES_DB:-supmeal}
      PORT: 4000
    volumes:
      - uploads_data:/app/uploads
    ports:
      - '4000:4000'

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: supmeal_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '3000:80'

volumes:
  postgres_data:
  uploads_data:
